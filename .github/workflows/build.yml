name: build-and-push

# main 머지 시 컨테이너 이미지를 빌드해 GHCR에 push한다(ADR-024 P3 · cicd.md P3 아티팩트).
# 빌드는 여기(GitHub Actions)에서 한다 — 로컬 빌드 없음. 배포는 별도로 배포-agent가
# 이 이미지를 digest로 pull해 수행한다(ADR-027). 태그는 커밋 SHA(불변 식별자 · CD-5).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # GHCR push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 테스트를 이미지 빌드보다 **먼저** 돌린다.
      # Dockerfile 의 빌드 스테이지는 bootJar 만 만들 뿐 테스트를 실행하지 않으므로,
      # 이 스텝이 없으면 깨진 코드로 만든 이미지가 그대로 GHCR 에 push 되고
      # 배포-agent 가 그 digest 를 집어간다(ADR-027). 스텝은 순차 실행이고 실패 시
      # 잡이 중단되므로, 여기서 막으면 이미지 자체가 발행되지 않는다.
      - name: JDK 21 셋업
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle   # ~/.gradle 의존성 캐시 — 래퍼/빌드스크립트 해시 기준
      - name: 테스트
        run: ./gradlew --no-daemon test

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 빌드·push (digest 출력)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jun-bank/gateway:${{ github.sha }}
            ghcr.io/jun-bank/gateway:latest
      - name: 이미지 digest 요약
        run: |
          echo "이미지: ghcr.io/jun-bank/gateway" >> $GITHUB_STEP_SUMMARY
          echo "digest: ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo "SHA 태그: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
