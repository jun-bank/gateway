name: build-and-push

# main 머지 시 컨테이너 이미지를 빌드해 GHCR에 push한다(ADR-024 P3 · cicd.md P3 아티팩트).
# 빌드는 여기(GitHub Actions)에서 한다 — 로컬 빌드 없음. 배포는 별도로 배포-agent가
# 이 이미지를 digest로 pull해 수행한다(ADR-027). 태그는 커밋 SHA(불변 식별자 · CD-5).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # GHCR push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 공급망 방어 — Gradle wrapper jar 가 변조되지 않았는지 공식 체크섬으로 검증한다.
      # gradlew 로 무엇이든 실행하기 전(빌드 앞단)에 두어, 변조된 래퍼가 돌기 전에 막는다.
      # 검증 실패 시 이 스텝에서 잡이 중단된다(fail-closed).
      - name: Gradle wrapper 검증
        uses: gradle/actions/wrapper-validation@v4

      - name: JDK 21 셋업
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle   # ~/.gradle 의존성 캐시 — 래퍼/빌드스크립트 해시 기준

      # 컴파일은 여기서 딱 1회. `build` 가 test 와 bootJar 를 한 번에 만든다.
      # 산출 jar(build/libs/*-SNAPSHOT.jar)를 아래 docker 스텝이 그대로 COPY 해 재사용하므로
      # 이미지 안에서 gradle 재컴파일이 없다(과거: test + Dockerfile clean bootJar = 컴파일 2회).
      #
      # test 는 build 앞단에 포함된다 — test 가 실패하면 이 스텝에서 잡이 중단되고
      # 뒤의 GHCR 로그인·docker push 는 실행되지 않는다. 즉 깨진 코드로 만든 이미지는
      # GHCR 에 발행되지 않는다(테스트-먼저-차단 순서 불변식).
      - name: 빌드 (test + bootJar)
        run: ./gradlew --no-daemon build

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 빌드·push (digest 출력)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jun-bank/gateway:${{ github.sha }}
            ghcr.io/jun-bank/gateway:latest
      - name: 이미지 digest 요약
        run: |
          echo "이미지: ghcr.io/jun-bank/gateway" >> $GITHUB_STEP_SUMMARY
          echo "digest: ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo "SHA 태그: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
