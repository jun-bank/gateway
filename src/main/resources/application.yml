server:
  port: 8080

spring:
  application:
    name: jun-bank-gateway
  cloud:
    gateway:
      routes:
        # 각 도메인 서버는 compose 서비스명(host)·포트 8080으로 뜬다.
        # StripPrefix=1 로 프리픽스 세그먼트를 제거해 도메인 서버의 루트(/) 기준 경로로 넘긴다.
        #   /settlement        -> settlement:8080  /   (PathPattern `/settlement/**` 은 프리픽스 세그먼트만 있는 `/settlement` 도 매칭한다)
        #   /settlement/health -> settlement:8080  /health
        #
        # core 라우트는 여기 없다 — 블루-그린 전환 대상이라 프로그램 라우트로 관리한다
        # (CoreRouteRegistry, 아래 junbank.routes.core 설정).
        - id: settlement
          uri: http://settlement:8080
          predicates:
            - Path=/settlement/**
          filters:
            - StripPrefix=1
        - id: ledger
          uri: http://ledger:8080
          predicates:
            - Path=/ledger/**
          filters:
            - StripPrefix=1

# 블루-그린 전환 대상인 core 라우트의 slot → URI 매핑.
# 이 매핑의 소유자는 배포 환경(환경변수)이다 — 게이트웨이는 지금 어느 slot이 활성인지만
# 관리하고, 전환은 POST /internal/routes/core/switch 로 받는다(ADR-031 BG-1 · BG-4 ⓐ).
#
# 기본값은 compose 스택의 서비스명 기준이다(다른 라우트와 같은 규칙: 서비스명 host + 8080).
# 호스트 포트로 배선하는 환경(예: core를 호스트에서 직접 띄우는 경우)은 env로 명시 주입한다.
#
# state-file: 설정하면 {활성 slot, 마지막 수락 token}을 그 파일에 write-ahead 로 남기고
# 기동 시 복원한다(CORE_ACTIVE_SLOT보다 우선). 비우면 기존 인메모리 동작.
junbank:
  routes:
    core:
      blue-uri: ${CORE_BLUE_URI:http://core:8080}
      green-uri: ${CORE_GREEN_URI:http://core-green:8080}
      active-slot: ${CORE_ACTIVE_SLOT:blue}
      state-file: ${CORE_STATE_FILE:}

# 게이트웨이 자신의 준비성만 노출한다(GET /actuator/health).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
